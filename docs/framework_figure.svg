<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1020" height="540" fill="#ffffff"/>

  <!-- ================= inputs ================= -->
  <g font-size="13" text-anchor="middle">
    <rect x="250" y="18" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#444"/>
    <text x="325" y="43">Dev set (10 docs)</text>
    <rect x="470" y="18" width="150" height="40" rx="4" fill="#f2f2f2" stroke="#444"/>
    <text x="545" y="43">Gold annotations</text>
  </g>

  <!-- ================= top row ================= -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="120" width="150" height="46" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="105" y="140">Annotation</text>
    <text x="105" y="157">guidelines</text>

    <rect x="250" y="120" width="150" height="46" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="1.5"/>
    <text x="325" y="149">LLM annotation</text>

    <rect x="470" y="120" width="150" height="46" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="545" y="149">Evaluation</text>

    <path d="M 760 108 L 852 143 L 760 178 L 668 143 z" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="760" y="139" font-size="10.5">F1 &#8805; 0.9 or</text>
    <text x="760" y="152" font-size="10.5">no improvement?</text>

    <rect x="880" y="112" width="126" height="62" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="943" y="132">Stop, then</text>
    <text x="943" y="149">evaluate on</text>
    <text x="943" y="166">validation set</text>
  </g>

  <!-- ===== rationale: produced on every annotation, then dropped ===== -->
  <rect x="238" y="206" width="184" height="44" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="330" y="224" font-size="11" text-anchor="middle" fill="#c0392b">rationale + cited section</text>
  <text x="330" y="240" font-size="11" text-anchor="middle" fill="#c0392b" font-style="italic">written to no output file</text>

  <!-- ================= moderation box ================= -->
  <rect x="20" y="310" width="986" height="130" rx="8" fill="none" stroke="#666" stroke-dasharray="5 4"/>
  <text x="40" y="329" font-size="12.5" fill="#666" font-style="italic">Moderation</text>

  <!-- ================= bottom row ================= -->
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="356" width="150" height="46" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="1.5"/>
    <text x="122" y="376">Guideline</text>
    <text x="122" y="393">refinement</text>

    <rect x="293" y="356" width="150" height="46" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="1.5"/>
    <text x="368" y="376">Principle</text>
    <text x="368" y="393">generation</text>

    <rect x="546" y="356" width="150" height="46" rx="4" fill="#d9d9d9" stroke="#444" stroke-width="1.5"/>
    <text x="628" y="376">Pattern</text>
    <text x="628" y="393">explanation</text>

    <rect x="799" y="356" width="150" height="46" rx="4" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
    <text x="874" y="376">Discrepancy</text>
    <text x="874" y="393">analysis</text>
  </g>

  <!-- ========= shared true-positive block ========= -->
  <rect x="340" y="470" width="360" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="489" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">true_positive_examples / verified_examples</text>
  <text x="520" y="508" font-size="11" text-anchor="middle" fill="#c0392b">the same 5 documents, quoted in full, every round</text>

  <!-- ================= edges ================= -->
  <g stroke="#222" stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <path d="M 325 58 L 325 118"/>
    <path d="M 545 58 L 545 118"/>
    <path d="M 180 143 L 248 143"/>
    <path d="M 400 143 L 468 143"/>
    <path d="M 620 143 L 666 143"/>
    <path d="M 852 143 L 878 143"/>
    <path d="M 760 178 L 760 250 L 874 250 L 874 354"/>
    <path d="M 799 379 L 698 379"/>
    <path d="M 546 379 L 445 379"/>
    <path d="M 293 379 L 192 379"/>
    <path d="M 40 379 L 24 379 L 24 143 L 28 143"/>
  </g>

  <!-- dropped output, and the true positives feeding two stages -->
  <g stroke="#c0392b" stroke-width="1.3" fill="none" marker-end="url(#arrowred)" stroke-dasharray="5 3">
    <path d="M 325 166 L 325 204"/>
    <path d="M 628 470 L 628 404"/>
    <path d="M 340 496 L 122 496 L 122 404"/>
  </g>

  <!-- ================= edge labels ================= -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="434" y="136">predictions</text>
    <text x="866" y="136">yes</text>
    <text x="774" y="203" text-anchor="start">no</text>
    <text x="748" y="333">dominant cluster,</text>
    <text x="748" y="345">discrepant_examples</text>
    <text x="495" y="339">discrepancy_insight</text>
    <text x="242" y="339">moderation_principle</text>
    <text x="34" y="290" text-anchor="start">refined guideline</text>
  </g>

  <!-- ================= issue markers, inside the stage they belong to ================= -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <circle cx="59" cy="374" r="10" fill="#c0392b"/><text x="59" y="378" fill="#fff">1</text>
    <circle cx="565" cy="374" r="10" fill="#c0392b"/><text x="565" y="378" fill="#fff">2</text>
    <circle cx="257" cy="228" r="10" fill="#c0392b"/><text x="257" y="232" fill="#fff">3</text>
  </g>

</svg>
